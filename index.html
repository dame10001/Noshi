<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نوشي | أفضل المنتجات مبيعاً - منشور 9:16</title>

<!-- Tajawal Font -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

<!-- html2canvas for image generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #2c1810 0%, #3d2a1f 100%);
    min-height: 100vh;
    padding: 16px;
    font-family: 'Tajawal', sans-serif;
}

/* الحاوية الرئيسية - مرنة للشاشات المختلفة */
.main-container {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
}

/* ===== لوحة التحكم (يمين) ===== */
.control-panel {
    flex: 1.2;
    min-width: 300px;
    background: #fff9f0;
    border-radius: 40px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    position: sticky;
    top: 20px;
    max-height: 90vh;
    overflow-y: auto;
}

.control-panel h2 {
    color: #5a3418;
    font-size: 26px;
    margin-bottom: 12px;
    border-bottom: 3px solid #d4a53a;
    display: inline-block;
}

.control-panel h3 {
    color: #b8862d;
    font-size: 20px;
    margin: 20px 0 12px 0;
}

.month-selector {
    background: #fef5e8;
    border-radius: 24px;
    padding: 16px;
    margin-bottom: 20px;
}

.month-selector label {
    display: block;
    font-weight: 800;
    color: #5a3418;
    margin-bottom: 8px;
}

.month-selector select {
    width: 100%;
    padding: 12px;
    border-radius: 18px;
    border: 2px solid #e7c46f;
    background: white;
    font-size: 16px;
    font-weight: bold;
    color: #5a3418;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
}

.products-list {
    max-height: 360px;
    overflow-y: auto;
    margin: 12px 0;
    border-radius: 24px;
    background: #fef5e8;
    padding: 8px;
}

.product-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    margin: 8px 0;
    padding: 12px;
    border-radius: 20px;
    border: 1px solid #f0e0c8;
    transition: all 0.2s;
}

.product-info {
    flex: 1;
}

.product-name {
    font-weight: 800;
    color: #5a3418;
    font-size: 15px;
}

.product-price {
    color: #b8862d;
    font-size: 13px;
    font-weight: 700;
}

.add-btn {
    background: #d4a53a;
    border: none;
    border-radius: 40px;
    padding: 6px 18px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
}

.add-btn:hover {
    background: #b8862d;
    transform: scale(1.02);
}

.add-btn.disabled {
    background: #ccc;
    cursor: not-allowed;
}

.selected-products {
    background: #fef5e8;
    border-radius: 24px;
    padding: 16px;
    margin: 16px 0;
}

.selected-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    margin: 8px 0;
    padding: 10px 12px;
    border-radius: 18px;
    border-right: 5px solid #d4a53a;
}

.rank-badge {
    width: 34px;
    height: 34px;
    background: #d4a53a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    font-size: 18px;
}

.selected-name {
    flex: 1;
    margin: 0 12px;
    font-weight: 800;
    color: #5a3418;
    font-size: 14px;
}

.remove-selected {
    background: #e74c3c;
    border: none;
    border-radius: 30px;
    padding: 5px 14px;
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}

.action-buttons {
    display: flex;
    gap: 14px;
    margin-top: 16px;
}

.btn {
    flex: 1;
    border: none;
    border-radius: 60px;
    padding: 14px;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Tajawal', sans-serif;
}

.btn-generate {
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: white;
}

.btn-clear {
    background: #e74c3c;
    color: white;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

.error-msg {
    background: #e74c3c;
    color: white;
    padding: 12px;
    border-radius: 20px;
    text-align: center;
    margin-top: 16px;
    display: none;
    font-weight: bold;
}

/* ===== منطقة المعاينة - عكس اتجاه التصميم (يسار) ===== */
.preview-area {
    flex: 1.5;
    min-width: 0;
    background: #f0e6d9;
    border-radius: 40px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.preview-area h3 {
    color: #5a3418;
    margin-bottom: 16px;
    font-size: 22px;
}

/* ----- تصميم البوستر الجديد مقاس 9:16 ثابت ----- */
.poster-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    border-radius: 32px;
    background: #e3d5c0;
    padding: 12px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.2);
}

/* النسبة الذهبية 9:16 - العرض 405px => الارتفاع 720px (9:16 = 0.5625) */
/* لضمان وضوح على iPhone وجميع الأجهزة نستخدم عرض 405px مثالي للمعاينة + حفظ */
.poster-916 {
    width: 360px;
    height: 640px;
    background: linear-gradient(145deg, #ffffff 0%, #fffbf4 100%);
    border-radius: 48px;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 18px 24px 18px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.2);
    direction: rtl;
    font-family: 'Tajawal', sans-serif;
    scrollbar-width: thin;
}

/* تزيين الحواف بنجوم صغيرة */
.poster-916::before {
    content: "✦";
    position: absolute;
    top: 18px;
    right: 22px;
    font-size: 48px;
    color: #f6e3b3;
    opacity: 0.55;
    pointer-events: none;
}

.poster-916::after {
    content: "✦";
    position: absolute;
    bottom: 18px;
    left: 22px;
    font-size: 48px;
    color: #f6e3b3;
    opacity: 0.5;
    pointer-events: none;
}

/* الهيدر */
.poster-header {
    text-align: center;
    margin-bottom: 12px;
    position: relative;
    z-index: 2;
}

.poster-logo {
    width: 150px;
    max-width: 80%;
    display: block;
    margin: 0 auto 6px;
}

.poster-title {
    font-size: 28px;
    font-weight: 900;
    color: #5a3418;
    line-height: 1.2;
    letter-spacing: -0.5px;
}

.poster-month {
    font-size: 20px;
    font-weight: 800;
    color: #b8862d;
    background: #fff1df;
    display: inline-block;
    padding: 2px 16px;
    border-radius: 40px;
    margin-top: 6px;
}

/* بطاقة المركز الأول (winner) */
.winner-card {
    width: 92%;
    margin: 12px auto 18px auto;
    background: linear-gradient(135deg, #fff7ea, #ffffff);
    border: 3px solid #e7c46f;
    border-radius: 32px;
    padding: 14px 12px;
    text-align: center;
    position: relative;
    box-shadow: 0 12px 22px rgba(0,0,0,0.06);
}

.winner-rank {
    position: absolute;
    top: 10px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #d4a53a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
}

.winner-crown {
    font-size: 34px;
    margin-bottom: 6px;
}

.winner-image {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 28px;
    border: 3px solid white;
    box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    background-color: #f9efdf;
}

.winner-name {
    margin-top: 10px;
    font-size: 22px;
    font-weight: 900;
    color: #5a3418;
}

.winner-price {
    font-size: 17px;
    font-weight: 800;
    color: #b8862d;
    background: #fef0df;
    display: inline-block;
    padding: 2px 14px;
    border-radius: 40px;
}

/* شبكة المنتجات 2x2 للمراكز 2-5 */
.products-grid-poster {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 12px 4px 12px 4px;
}

.product-card {
    background: #ffffff;
    border: 2px solid #f3e4cb;
    border-radius: 28px;
    padding: 10px 6px;
    text-align: center;
    position: relative;
    transition: all 0.1s;
    backdrop-filter: blur(0px);
}

.product-rank {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #d4a53a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.product-card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 22px;
    margin-bottom: 8px;
    background: #faf1e2;
}

.product-card .name {
    font-size: 16px;
    font-weight: 800;
    color: #5a3418;
    line-height: 1.3;
    padding: 0 4px;
}

.product-card .price {
    font-size: 14px;
    font-weight: 800;
    color: #b8862d;
    margin-top: 4px;
}

/* الفوتر */
.poster-footer {
    margin-top: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: #5a3418;
    background: #fff5ea;
    padding: 6px;
    border-radius: 60px;
    width: 90%;
    margin-left: auto;
    margin-right: auto;
}

.poster-footer span {
    color: #d4a53a;
    font-size: 20px;
}

/* تنسيق رسائل مساعدة */
.helper-note {
    color: #776b5d;
    font-size: 12px;
    margin-top: 12px;
    background: #e9ddd0;
    padding: 6px 14px;
    border-radius: 40px;
}

.toast-msg {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #27ae60;
    color: white;
    padding: 12px 28px;
    border-radius: 60px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 2000;
    font-family: 'Tajawal', sans-serif;
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    pointer-events: none;
}

.toast-msg.show {
    opacity: 1;
}

/* تحسين التمرير داخل البوستر إذا كان المحتوى طويل قليلاً */
.poster-916::-webkit-scrollbar {
    width: 4px;
}
.poster-916::-webkit-scrollbar-track {
    background: #f1e6d8;
    border-radius: 10px;
}
.poster-916::-webkit-scrollbar-thumb {
    background: #d4a53a;
    border-radius: 10px;
}

@media (max-width: 780px) {
    .poster-916 {
        width: 330px;
        height: 586px;
        padding: 18px 14px;
    }
    .winner-image {
        width: 100px;
        height: 100px;
    }
    .product-card img {
        width: 85px;
        height: 85px;
    }
    .poster-title {
        font-size: 24px;
    }
    .winner-name {
        font-size: 19px;
    }
}
</style>
</head>
<body>

<div class="main-container">
    
    <!-- لوحة التحكم -->
    <div class="control-panel">
        <h2>🏆 أفضل المنتجات مبيعاً</h2>
        
        <div class="month-selector">
            <label>📅 اختر الشهر:</label>
            <select id="monthSelect">
                <option value="يناير">يناير 2026</option><option value="فبراير">فبراير 2026</option>
                <option value="مارس">مارس 2026</option><option value="أبريل">أبريل 2026</option>
                <option value="مايو" selected>مايو 2026</option>
                <option value="يونيو">يونيو 2026</option><option value="يوليو">يوليو 2026</option>
                <option value="أغسطس">أغسطس 2026</option><option value="سبتمبر">سبتمبر 2026</option>
                <option value="أكتوبر">أكتوبر 2026</option><option value="نوفمبر">نوفمبر 2026</option>
                <option value="ديسمبر">ديسمبر 2026</option>
            </select>
        </div>
        
        <h3>🍰 المنتجات المتاحة</h3>
        <div class="products-list" id="productsList"></div>
        
        <h3>🛒 المنتجات المختارة (1-5)</h3>
        <div class="selected-products" id="selectedList">
            <p style="color:#aaa; text-align:center;">لم يتم اختيار أي منتج</p>
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-generate" id="generateBtn">📸 حفظ الصورة (9:16)</button>
            <button class="btn btn-clear" id="clearCartBtn">🗑️ مسح الكل</button>
        </div>
        <div class="error-msg" id="errorMsg">⚠️ يجب اختيار 5 منتجات بالضبط</div>
    </div>
    
    <!-- منطقة المعاينة -->
    <div class="preview-area">
        <h3>📱 معاينة المنشور (نسبة 9:16)</h3>
        <div class="poster-wrapper" id="posterWrapper">
            <div id="posterContainer">
                <!-- البوستر سيتم حقنه ديناميكياً -->
            </div>
        </div>
        <p class="helper-note">⬅️ عند الضغط على "حفظ الصورة" سيتم إنشاء PNG بدقة عالية بنفس التصميم.</p>
    </div>
</div>

<div class="toast-msg" id="toastMsg">✅ تم حفظ الصورة بنجاح</div>

<script>
// ===================== البيانات (كيك + حلويات) =====================
const cakes = [
    {name: "كيكة ليمون", price: 32, img:"lemon.png"},
    {name: "كيكة سينابون", price: 35, img:"cinnamon1.png"},
    {name: "كيكة برتقال", price: 36, img:"orange.png"},
    {name: "كيكة رمل", price: 45, img:"sand.jpg"},
    {name: "كيكة كوكيز", price: 60, img:"cookies.png"},
    {name: "كيكة ماربل", price: 50, img:"marble.png"},
    {name: "كيكة دايجستف", price: 50, img:"digestive.png"},
    {name: "كيك دايجستف ميني", price: 60, img:"digestive.png"},		
    {name: "كيكة تمر", price: 45, img:"dates.png"},
    {name: "قرص عقيلي", price: 39, img:"aqeeli.png"},
    {name: "كيكة شوكليت", price: 50, img:"choco.jpg"},
    {name: "ميني كيك ليمون", price: 60, img:"minilemon.png"},
    {name: "كيكة الكيري", price: 45, img:"kiri.png"}
];

const sweets = [
    {name: "خلية قرفة", price: 26, img:"honey1.png"},
    {name: "خلية سمسم", price: 26, img:"honey2.png"},
    {name: "خلية سميد", price: 26, img:"honey3.png"},
    {name: "تاوة نوشي", price: 38, img:"tawa.png"},
    {name: "تاوة نوشي ميني", price: 45, img:"tawamini.png"},
    {name: "سينابون", price: 60, img:"cinnabon.png"},
    {name: "كرات الشعيرية", price: 65, img:"shariya.png"},
    {name: "فطيرة حلزونية", price: 40, img:"spiral.png"},
    {name: "تارت تفاح", price: 60, img:"tart.png"},
    {name: "تارت تشيز التمر", price: 60, img:"tartdate.png"},
    {name: "بوب كيك ليمون", price: 50, img:"popcakelemon.png"},
    {name: "بوب كيك شوكليت", price: 50, img:"popcakechoco.png"},
    {name: "بسبوسة", price: 60, img:"basbousa.png"},
    {name: "تشيز القشد", price: 55, img:"chesedate.png"},
    {name: "فطيرة المربى", price: 50, img:"jam.png"},
    {name: "وردات الشوكولاتة", price: 60, img:"rose.png"},
    {name: "تارت البيكان", price: 65, img:"bekan.png"}
];

const allProducts = [...cakes, ...sweets];
let selectedProducts = []; // max 5

// ========== عرض المنتجات المتاحة ==========
function renderAvailableProducts() {
    const container = document.getElementById('productsList');
    container.innerHTML = '';
    
    allProducts.forEach(product => {
        const isSelected = selectedProducts.some(p => p.name === product.name);
        const isFull = selectedProducts.length >= 5;
        const div = document.createElement('div');
        div.className = 'product-item';
        div.innerHTML = `
            <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="product-price">${product.price} ريال</div>
            </div>
            <button class="add-btn" data-name="${product.name}" ${isSelected || isFull ? 'disabled' : ''}>
                ${isSelected ? '✓ تمت الإضافة' : '+ إضافة'}
            </button>
        `;
        const btn = div.querySelector('.add-btn');
        if (!isSelected && !isFull) {
            btn.addEventListener('click', () => addToSelected(product));
        }
        container.appendChild(div);
    });
}

function addToSelected(product) {
    if (selectedProducts.length >= 5) {
        showError('لا يمكن إضافة أكثر من 5 منتجات');
        return;
    }
    if (selectedProducts.some(p => p.name === product.name)) {
        showError('المنتج مضاف بالفعل');
        return;
    }
    selectedProducts.push({...product});
    renderSelectedProducts();
    renderAvailableProducts();
    updatePosterPreview();
    hideError();
}

function removeFromSelected(index) {
    selectedProducts.splice(index, 1);
    renderSelectedProducts();
    renderAvailableProducts();
    updatePosterPreview();
    hideError();
}

function renderSelectedProducts() {
    const container = document.getElementById('selectedList');
    if (selectedProducts.length === 0) {
        container.innerHTML = '<p style="color:#aaa; text-align:center;">لم يتم اختيار أي منتج</p>';
        return;
    }
    container.innerHTML = '';
    selectedProducts.forEach((product, idx) => {
        const rank = idx + 1;
        const div = document.createElement('div');
        div.className = 'selected-item';
        div.innerHTML = `
            <div class="rank-badge">${rank}</div>
            <div class="selected-name">${product.name} (${product.price} ريال)</div>
            <button class="remove-selected" data-index="${idx}">✖ حذف</button>
        `;
        div.querySelector('.remove-selected').addEventListener('click', () => removeFromSelected(idx));
        container.appendChild(div);
    });
}

// ========== بناء البوستر بشكل ديناميكي مع المقاس 9:16 (عرض ثابت بالـ CSS) ==========
function buildPosterHTML() {
    const month = document.getElementById('monthSelect').value;
    if (selectedProducts.length !== 5) {
        return `
            <div class="poster-916" style="display:flex; align-items:center; justify-content:center; text-align:center; background:#fcf5ea;">
                <div style="color:#b8862d; font-weight:bold; padding:20px;">
                    ⚠️ يرجى اختيار 5 منتجات<br>
                    <span style="font-size:13px;">(المرتبة الأولى ستكون في المنتصف)</span>
                </div>
            </div>
        `;
    }
    
    const winner = selectedProducts[0];
    const others = selectedProducts.slice(1, 5); // الباقي 4 منتجات
    
    return `
        <div class="poster-916" id="posterToCapture">
            <div class="poster-header">
                <img src="Noshi.png" class="poster-logo" alt="نوشي" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%2050%22%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%20fill%3D%22%23b8862d%22%3ENoshi%3C%2Ftext%3E%3C%2Fsvg%3E'">
                <div class="poster-title">المنتجات الأكثر مبيعاً</div>
                <div class="poster-month">${month}</div>
            </div>
            
            <div class="winner-card">
                <div class="winner-rank">1</div>
                <div class="winner-crown">👑</div>
                <img src="${winner.img}" class="winner-image" alt="${winner.name}" onerror="this.src='placeholder.png'">
                <div class="winner-name">${winner.name}</div>
                <div class="winner-price">${winner.price} ريال</div>
            </div>
            
            <div class="products-grid-poster">
                ${others.map((product, idx) => `
                    <div class="product-card">
                        <div class="product-rank">${idx + 2}</div>
                        <img src="${product.img}" alt="${product.name}" onerror="this.src='placeholder.png'">
                        <div class="name">${product.name}</div>
                        <div class="price">${product.price} ريال</div>
                    </div>
                `).join('')}
            </div>
            
            <div class="poster-footer">
                <span>نوشي</span> .. كل شيء لذيذ 🤎
            </div>
        </div>
    `;
}

function updatePosterPreview() {
    const container = document.getElementById('posterContainer');
    if (!container) return;
    const html = buildPosterHTML();
    container.innerHTML = html;
}

// ========== توليد الصورة بدقة عالية مع الحفاظ على نسبة 9:16 ==========
async function generateImage() {
    if (selectedProducts.length !== 5) {
        showError('يجب اختيار 5 منتجات بالضبط لإنشاء الصورة');
        return;
    }
    
    // تحديث المعاينة للتأكد من أحدث البيانات
    updatePosterPreview();
    
    // انتظار تحميل الصور
    await new Promise(resolve => setTimeout(resolve, 400));
    
    const posterElement = document.getElementById('posterToCapture');
    if (!posterElement) {
        showError('حدث خطأ في بناء البوستر');
        return;
    }
    
    // معالجة جميع الصور للتأكد من تحميلها
    const images = posterElement.querySelectorAll('img');
    await Promise.all(
        [...images].map(img => {
            return new Promise(resolve => {
                if (img.complete && img.naturalHeight !== 0) {
                    resolve();
                } else {
                    img.onload = () => resolve();
                    img.onerror = () => resolve();
                    if (img.src && img.src !== 'placeholder.png') {
                        // إعادة تعيين في بعض الحالات
                    }
                }
            });
        })
    );
    
    try {
        // التقاط العنصر بدقة عالية ونسبة ثابتة
        const canvas = await html2canvas(posterElement, {
            scale: 3.2,          // دقة عالية جداً مناسبة للطباعة والهواتف
            backgroundColor: '#ffffff',
            useCORS: true,
            logging: false,
            allowTaint: false,
            windowWidth: posterElement.scrollWidth,
            windowHeight: posterElement.scrollHeight
        });
        
        // حفظ كصورة PNG
        canvas.toBlob(async (blob) => {
            const fileName = `Noshi_TopProducts_${selectedProducts[0]?.name || 'poster'}_${Date.now()}.png`;
            const file = new File([blob], fileName, { type: 'image/png' });
            
            // محاولة المشاركة إذا كانت المدعومة، وإلا تحميل مباشر
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: 'أفضل المنتجات - نوشي',
                    text: `أفضل 5 منتجات مبيعاً لشهر ${document.getElementById('monthSelect').value}`,
                    files: [file]
                });
                showToast('✅ تمت المشاركة بنجاح');
            } else {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
                URL.revokeObjectURL(link.href);
                showToast('✅ تم حفظ الصورة (9:16)');
            }
        }, 'image/png', 0.98);
        
    } catch (err) {
        console.error(err);
        showError('فشل إنشاء الصورة، حاول مجدداً');
    }
}

function clearAll() {
    selectedProducts = [];
    renderSelectedProducts();
    renderAvailableProducts();
    updatePosterPreview();
    hideError();
    showToast('🗑️ تم مسح جميع المنتجات');
}

// ========== أدوات مساعدة ==========
function showError(msg) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.textContent = `⚠️ ${msg}`;
    errorEl.style.display = 'block';
    setTimeout(() => {
        if(errorEl) errorEl.style.display = 'none';
    }, 2800);
}
function hideError() {
    const errorEl = document.getElementById('errorMsg');
    if(errorEl) errorEl.style.display = 'none';
}
function showToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== الأحداث والتهيئة ==========
document.getElementById('generateBtn').addEventListener('click', generateImage);
document.getElementById('clearCartBtn').addEventListener('click', clearAll);
document.getElementById('monthSelect').addEventListener('change', () => updatePosterPreview());

// تهيئة أولية
renderAvailableProducts();
renderSelectedProducts();
updatePosterPreview();
</script>
</body>
</html>
